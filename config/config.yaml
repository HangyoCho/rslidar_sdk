common:
  msg_source: 1                         # 0: not use Lidar
                                        # 1: packet message comes from online Lidar
                                        # 2: packet message comes from ROS or ROS2
                                        # 3: packet message comes from Pcap file
  send_packet_ros: false                # true: Send packets through ROS or ROS2(Used to record packet)
  send_point_cloud_ros: true            # true: Send point cloud through ROS or ROS2
lidar:
  - driver:
      lidar_type: RSAIRY           #  LiDAR type - RS16, RS32, RSBP, RSAIRY, RSFAIRY, RSHELIOS, RSHELIOS_16P, RS128, RS80, RS48, RSP128, RSP80, RSP48,
                                   #               RSM1, RSM1_JUMBO, RSM2, RSM3, RSE1, RSMX, RSEMX.
                                   
      msop_port: 6699              #  Msop port of lidar
      difop_port: 7788             #  Difop port of lidar (Note that: For RSEMX, use the port num of DIFOP2 if both DIFOP1 & DIFOP2 exist. Default 7766.)
      imu_port: 6688               #  IMU port of lidar(only for RSAIRY, RSE1), 0 means no imu.
                                   #  If you want to use IMU, please first set ENABLE_IMU_DATA_PARSE to ON in CMakeLists.txt 
      user_layer_bytes: 0          #  Bytes of user layer. thers is no user layer if it is 0         
      tail_layer_bytes: 0          #  Bytes of tail layer. thers is no tail layer if it is 0


      min_distance: 0.2            #  Minimum distance of point cloud
      max_distance: 200            #  Maximum distance of point cloud (Note that: 200 normally, 300 for RSEMX)
      use_lidar_clock: false       #  hardware offset measured ≈ 0 with use_lidar_clock=true → keep imu_time_offset 0
                                   #  false-- Use the system clock as the timestamp
      dense_points: false          #  true: discard NAN points; false: reserve NAN points
      
      ts_first_point: true         #  true: time-stamp point cloud with the first point; false: with the last point;   
                                   #  these parameters are used from mechanical lidar

      start_angle: 0               #  Start angle of point cloud
      end_angle: 360               #  End angle of point cloud

                                   #  Per-channel range bias correction (driver-side).
                                   #  YAML produced by lidar_range_calibrator's save_now.
                                   #  Empty / missing => no correction (raw output).
      range_offsets_yaml: config/range_offsets_srxr1.yaml   # Relative to the rslidar_sdk source root (PROJECT_PATH). Empty disables.

                                   #  Per-channel VERTICAL ANGLE override (driver-side).
                                   #  YAML schema: ring_count + rings: [{ring, vertical_angle}] (DEGREES).
                                   #  Replaces firmware vertAdjust per channel; horizAdjust stays
                                   #  intact (so points don't fan out along the rotation axis).
                                   #  Coexists with range_offsets_yaml. Ignored when
                                   #  alice_intrinsics_yaml below is active.
      vertical_angles_yaml: config/airy_datasheet_vertical_angles.yaml   # Datasheet override. Empty disables.

                                   #  Box crop filter (SDK-side, post-decode).
                                   #  Drops any point whose (x, y, z) sits inside ANY of the listed
                                   #  axis-aligned boxes. Useful for masking the RC-car body / mast /
                                   #  antenna that the lidar would otherwise see every frame.
                                   #
                                   #  The boxes live in the PUBLISHED point-cloud frame — i.e. AFTER the
                                   #  x/y/z/roll/pitch/yaw transform below. So if you mount the lidar
                                   #  facing +x with z-up and want to mask the chassis directly under
                                   #  the sensor, use small symmetric x/y ranges and a negative-z range.
                                   #
                                   #  Tuning workflow: enable filter, view /rslidar_points in rviz with
                                   #  a TF aligned to the lidar, draw a tight box around the visible
                                   #  ego returns, plug those bounds in below. Bounds are inclusive in
                                   #  meters. Disable with enable: false (or remove the block).
                                   #
                                   #  Behavior wrt dense_points:
                                   #   - dense_points: true  -> filtered points are erased (compacted)
                                   #   - dense_points: false -> filtered points become NaN (grid kept)
      box_filter:
        enable: false
        remove_inside:
          # Example: ~30 cm RC car, lidar mounted ~10 cm above chassis center,
          # sensor frame x-forward / y-left / z-up. Adjust to your vehicle.
          - { name: chassis, x_min: -0.20, x_max: 0.15, y_min: -0.12, y_max: 0.12, z_min: -0.20, z_max: 0.02 }
          - { name: mast,    x_min: -0.04, x_max: 0.04, y_min: -0.04, y_max: 0.04, z_min: -0.10, z_max: 0.05 }
          - { name: antenna, x_min: -0.10, x_max: 0.10, y_min: -0.10, y_max: 0.10, z_min:  0.05, z_max: 0.40 }

                                   #  When msg_source is 3, the following parameters will be used
      pcap_repeat: true            #  true: The pcap bag will repeat play   
      pcap_rate: 1.0               #  Rate to read the pcap file
      pcap_path: /home/robosense/lidar.pcap #The path of pcap file

    ros:
      ros_frame_id: rslidar                           #Frame id of packet message and point cloud message
      ros_recv_packet_topic: /rslidar_packets          #Topic used to receive lidar packets from ROS
      ros_send_packet_topic: /rslidar_packets          #Topic used to send lidar packets through ROS
      ros_send_imu_data_topic: /rslidar_imu_data         #Topic used to send imu data through ROS
      ros_send_point_cloud_topic: /rslidar_points      #Topic used to send point cloud through ROS
      ros_queue_length: 100                            #Topic QoS history depth
