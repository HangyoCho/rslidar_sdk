# Default per-channel range bias template (no correction).
#
# Schema:
#   ring_count: <int>           total number of channels on the lidar
#   rings:                      list of per-channel offsets, in meters
#     - { ring: <int>, offset_m: <float> }
#
# offset_m is subtracted from the raw measured range BEFORE the decoder
# converts to (x, y, z). A positive offset moves the resulting point
# closer to the sensor along its ray. Missing rings default to 0.
#
# Generate one of these per sensor with the lidar_range_calibrator tool
# and reference it from `range_offsets_yaml` in config.yaml.

ring_count: 96
